name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # 公开仓库的标准 macOS runner 免费。这一步只证明「编得过 + 纯逻辑单测过」，
    # 不签名、不出 ipa —— 真实屏蔽与阈值回调在模拟器上测不了，必须真机。
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install xcodegen protobuf swift-protobuf

      - name: Generate Swift protobuf
        run: bash tools/gen-proto.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (simulator, unsigned)
        run: |
          # 逐个 target 编，不让第一个错误短路后面的 target：
          # 一轮 macOS runner 要几分钟，一次只暴露一个 target 的错太贵。
          # 每个 target 都要试完，最后只要有任一失败就整体失败。
          FAILED=""
          for target in QuizGateKit QuizGateKitTests QuizGateMonitor QuizGateShieldConfig QuizGateShieldAction QuizGate; do
            echo "===== target: $target ====="
            # 这一步开的是 pipefail，所以管道状态取的就是 xcodebuild；
            # 放进 if 里是为了不让 -e 在第一个失败 target 处直接把整步掀掉。
            if xcodebuild \
              -project QuizGate.xcodeproj \
              -target "$target" \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tail -200; then
              echo "VERDICT $target OK"
            else
              echo "VERDICT $target FAILED"
              FAILED="$FAILED $target"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "编译失败的 target：" $FAILED >&2
            exit 1
          fi

      - name: Pick an available simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone [0-9][^(]*\([A-F0-9-]{36}\)' \
            | head -1 \
            | grep -Eo '[A-F0-9-]{36}')
          if [ -z "$UDID" ]; then
            echo "runner 上没有可用的 iPhone 模拟器" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test (pure logic only)
        run: |
          xcodebuild \
            -project QuizGate.xcodeproj \
            -scheme QuizGate \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO \
            test