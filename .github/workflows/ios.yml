name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # 公开仓库的标准 macOS runner 免费。这一步只证明「编得过 + 纯逻辑单测过」，
    # 不签名、不出 ipa —— 真实屏蔽与阈值回调在模拟器上测不了，必须真机。
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install xcodegen protobuf swift-protobuf

      - name: Generate Swift protobuf
        run: bash tools/gen-proto.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          # -target 构建不会替我们把 SPM 依赖解析出来，少这一步就是满屏
          # 「no such module 'SwiftProtobuf'」，而且报的是依赖，不是我们的代码。
          xcodebuild -resolvePackageDependencies \
            -project QuizGate.xcodeproj \
            -scheme QuizGate \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build (simulator, unsigned)
        run: |
          # 逐个 target 编，不让第一个失败短路后面的 target：一轮 runner 要几分钟，
          # 一次只暴露一个 target 的错太贵。所以这里显式关掉 -e，最后自己决定退出码。
          set +e
          FAILED=""
          # 阳性对照：管道的左侧失败必须被下面的状态捕获抓到，
          # 否则这整道编译闸门就是假绿（上一轮就是这么把 6 个失败读成 6 个 OK 的）。
          false | true
          if [ "${PIPESTATUS[0]}" = "0" ]; then
            echo "闸门自检失败：PIPESTATUS 吃不到退出码，本步骤的判定不可信" >&2
            exit 1
          fi
          echo "闸门自检通过（false|true -> ${PIPESTATUS[0]}）"

          for target in QuizGateKit QuizGateKitTests QuizGateMonitor QuizGateShieldConfig QuizGateShieldAction QuizGate; do
            echo "===== target: $target ====="
            xcodebuild \
              -project QuizGate.xcodeproj \
              -target "$target" \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -clonedSourcePackagesDirPath SourcePackages \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tail -250
            status=${PIPESTATUS[0]}
            if [ "$status" != "0" ]; then
              echo "VERDICT $target FAILED (exit=$status)"
              FAILED="$FAILED $target"
            else
              echo "VERDICT $target OK"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "编译失败的 target：" $FAILED >&2
            exit 1
          fi

      - name: Pick an available simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone [0-9][^(]*\([A-F0-9-]{36}\)' \
            | head -1 \
            | grep -Eo '[A-F0-9-]{36}')
          if [ -z "$UDID" ]; then
            echo "runner 上没有可用的 iPhone 模拟器" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test (pure logic only)
        run: |
          xcodebuild \
            -project QuizGate.xcodeproj \
            -scheme QuizGate \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO \
            test