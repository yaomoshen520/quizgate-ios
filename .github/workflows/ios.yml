name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # 公开仓库的标准 macOS runner 免费。这一步只证明「编得过 + 纯逻辑单测过」，
    # 不签名、不出 ipa —— 真实屏蔽与阈值回调在模拟器上测不了，必须真机。
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install xcodegen protobuf swift-protobuf

      - name: Generate Swift protobuf
        run: bash tools/gen-proto.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          # -target 构建不会替我们把 SPM 依赖解析出来，少这一步就是满屏
          # 「no such module 'SwiftProtobuf'」，而且报的是依赖，不是我们的代码。
          xcodebuild -resolvePackageDependencies \
            -project QuizGate.xcodeproj \
            -scheme QuizGate \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build (simulator, unsigned)
        run: |
          # 逐个 scheme 编，不让第一个失败短路后面的 target：一轮 runner 要几分钟，
          # 一次只暴露一个 target 的错太贵。所以这里显式关掉 -e，最后自己决定退出码。
          set +e

          # 把一行诊断变成一枚 annotation。为什么走 annotation 而不是日志：
          # Actions 的日志（/actions/runs/{id}/logs 和网页里的展开）都要仓库 admin 的
          # 登录态才能下载，而 check-runs/{id}/annotations 对公开仓库免凭据可读。
          # 这一条通道让「构建红了但没人知道红在哪」在这台没有 Xcode 的机器上闭环。
          annotate() { # annotate <scheme> <原始行>
            local esc
            # % 与 ] 必须先转义再截断：GitHub 用这两个字符切 workflow 命令，
            # 未转义等于把日志内容当命令本身执行。
            esc=$(printf '%s' "$2" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/]/%5D/g')
            printf '::error title=%s 编译诊断::%s\n' "$1" "${esc:0:280}"
          }

          # 闸门自检：判定用的是命令的 $?，那它必须先能抓到一次非零。
          # 上一轮的假绿就是因为退出码被管道吃掉了 —— 检查器自己没证据时，绿不算数。
          false
          selfcheck=$?
          if [ "$selfcheck" = "0" ]; then
            echo "闸门自检失败：退出码没抓到，本步骤的判定不可信" >&2
            exit 1
          fi
          echo "闸门自检通过（false -> $selfcheck）"

          SCHEMES="QuizGateKit QuizGateKitTests QuizGateMonitor QuizGateShieldConfig QuizGateShieldAction QuizGate"

          # 反面哨兵：上面这串 scheme 名必须真的都在工程里。
          # 名字写错时 xcodebuild 报的是「Scheme X is not currently loaded」，
          # 那会被读成「这个 target 编不过」，其实是我们的清单和 project.yml 脱钩了。
          LIST=$(xcodebuild -list -project QuizGate.xcodeproj 2>&1)
          echo "$LIST"
          MISSING=""
          for s in $SCHEMES; do
            echo "$LIST" | grep -qE "^[[:space:]]+$s\$" || MISSING="$MISSING $s"
          done
          if [ -n "$MISSING" ]; then
            echo "project.yml 里缺这些 scheme（不是代码错，是清单脱钩）：" $MISSING >&2
            exit 1
          fi

          FAILED=""
          # annotation 的落地文件：每一枚失败 scheme 的诊断都追加到这里，
          # 循环结束后一次性发出（见下面「编译失败的 scheme」那段）。
          : > annotations.txt
          for name in $SCHEMES; do
            echo "===== scheme: $name ====="
            # -target 不接 SPM 产物（SwiftProtobuf 会满屏找不到），只有 -scheme 会解析。
            xcodebuild \
              -project QuizGate.xcodeproj \
              -scheme "$name" \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -clonedSourcePackagesDirPath SourcePackages \
              CODE_SIGNING_ALLOWED=NO \
              build > "build-$name.log" 2>&1
            status=$?
            if [ "$status" != "0" ]; then
              echo "VERDICT $name FAILED (exit=$status)"
              # 先去时间戳再去路径前缀：反了的话 sed 会把整行上下文一起吃掉。
              clean="build-$name.clean.log"
              sed -E 's#^[0-9-]{10}T[0-9:.]+Z[[:space:]]+##; s#^.*quizgate-ios/##' "build-$name.log" > "$clean"
              echo "--- 诊断（编译 / 依赖类） ---"
              grep -E "error:|no such module|not currently loaded|Undefined symbol|ld: |fatal" "$clean" \
                | sort -u | head -40
              # 上一轮只印出 clang 那句「linker command failed」汇总，ld 真正抱怨的那几行
              # 里没有 "error:"，被我原来的过滤条件整片漏掉 —— 检查器口径窄于事实时，
              # 「只有汇总」会被读成「错误就这么多」。链接失败就把汇总前的 30 行原样打出来。
              if grep -q "linker command failed" "$clean"; then
                echo "--- 链接区（clang 汇总前 32 行，ld 原话在这里） ---"
                grep -B32 "linker command failed" "$clean" | tail -34
              fi
              FAILED="$FAILED $name"
              # 同一批诊断落一份到 annotations.txt，循环结束后统一发。
              # 不在这里直接 printf 是因为 GitHub 每个 check run 的 annotation 有上限，
              # 六个 target 各报 10 行会把真正第一处错误挤出上限之外。
              grep -E "error:|no such module|not currently loaded|Undefined symbol|ld: |fatal" "$clean" \
                | sort -u | head -10 > "err-$name.txt" || true
              while IFS= read -r e; do
                printf '%s | %s\n' "$name" "$e" >> annotations.txt
              done < "err-$name.txt"
            else
              echo "VERDICT $name OK"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "编译失败的 scheme：" $FAILED >&2
            # 先报 scheme 清单再报逐行诊断：只有逐行没有 target 名的话，
            # 拿到错误也还得再猜它编的是哪一枚产物。
            annotate FAILED "scheme:$FAILED"
            head -12 annotations.txt | while IFS= read -r l; do
              annotate "$(printf '%s' "$l" | cut -d'|' -f1 | tr -d ' ')" "$l"
            done
            exit 1
          fi

      - name: Pick an available simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone [0-9][^(]*\([A-F0-9-]{36}\)' \
            | head -1 \
            | grep -Eo '[A-F0-9-]{36}')
          if [ -z "$UDID" ]; then
            echo "runner 上没有可用的 iPhone 模拟器" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test (pure logic only)
        run: |
          set +e
          xcodebuild \
            -project QuizGate.xcodeproj \
            -scheme QuizGate \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            test > test.log 2>&1
          status=$?
          # 同编译那步：整份日志直接刷进 CI 输出会被截断，先把诊断捞出来。
          grep -E "error:|failed|Test Suite|Executed .* tests|not currently loaded" test.log \
            | sed -E 's#^.*quizgate-ios/##; s#^[0-9-]{10}T[0-9:.]+Z ##' \
            | tail -80
          if [ "$status" != "0" ]; then
            # 单测失败也走 annotation：Actions 日志要仓库 admin 的登录态才能下载
            # （403 是权限不是配额），而 check-runs/{id}/annotations 对公开仓库免凭据可读。
            # 上一轮只给编译步接了这条通道，测试步红了我们照样只能干等。
            annotate() { # annotate <原始行>
              local esc
              # % 与 ] 先转义再截断，否则 GitHub 会把日志内容当 workflow 命令解析。
              esc=$(printf '%s' "$1" | tr -d '\r' | sed -e 's/%/%25/g' -e 's/]/%5D/g')
              printf '::error title=单测诊断::%s\n' "${esc:0:280}"
            }
            # 口径和上面那条 grep 保持一致（外加 XCTAssert / Test Case 两型），
            # 窄了就会出现「测试红了但一行诊断都没报」。
            grep -E "error:|XCTAssert|Test Case .*failed|Test Suite .*failed|Executed [0-9]+ test|not currently loaded" test.log \
              | sed -E 's#^.*quizgate-ios/##; s#^[0-9-]{10}T[0-9:.]+Z ##' \
              | sort -u | tail -10 > test-errors.txt
            while IFS= read -r l; do annotate "$l"; done < test-errors.txt
          fi
          echo "TEST EXIT=$status"
          exit "$status"

  # ------------------------------------------------------------------
  # 真机 .ipa：给巨魔（TrollStore）侧载用。
  # 能不走证书的原因：TrollStore 绕过的是「必须有描述文件」这一层，不是「必须有签名」，
  # 所以这里做的是 ad-hoc 签名（identity = "-"）+ 把我们自己的 entitlements 塞进去。
  # 证书、App Store、TestFlight 一概不碰。
  # ------------------------------------------------------------------
  ipa:
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install xcodegen protobuf swift-protobuf

      - name: Generate Swift protobuf
        run: bash tools/gen-proto.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (device, unsigned)
        run: |
          set +e
          # 同编译那步的规矩：判定用的是退出码，那它必须先能抓到一次非零。
          false
          selfcheck=$?
          if [ "$selfcheck" = "0" ]; then
            echo "闸门自检失败：退出码没抓到，本步骤的判定不可信" >&2
            exit 1
          fi
          xcodebuild \
            -project QuizGate.xcodeproj \
            -scheme QuizGate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build-device.log 2>&1
          status=$?
          sed -E 's#^[0-9-]{10}T[0-9:.]+Z[[:space:]]+##; s#^.*quizgate-ios/##' build-device.log > build-device.clean.log
          grep -E "error:|no such module|Undefined symbol|ld: |fatal" build-device.clean.log | sort -u | head -40
          echo "BUILD EXIT=$status"
          exit "$status"

      - name: Assemble Payload and ad-hoc sign
        run: |
          set -e
          PROD=dd/Build/Products/Release-iphoneos
          APP="$PROD/QuizGate.app"
          [ -d "$APP" ] || { echo "找不到 $APP，前面那步没真产出 device 包" >&2; exit 1; }

          # application-identifier 这一条从来就不写在 .entitlements 里：它是 Xcode 从描述文件
          # 读出来、签进二进制的那一项（对比 kingstinct 那四个 target 的 entitlements，也只有
          # family-controls + App Group）。我们 ad-hoc 签、没有描述文件，所以没人替我们写它，
          # 于是巨魔装上去授权全绿、一到「选 App」就被服务端拒：
          # 「某缺少"application-identifier"授权的App曾尝试管理用量预算」——
          # DeviceActivity 的用量预算就是靠这个串认调用者的。
          # 这里手工补，team id 沿用巨魔自己的约定（TROLLTROLL），后缀用每个 target 自己的
          # bundle id。仓库里那四份 plist 保持不动，将来上真证书时那份还是 Xcode 能直接用的。
          TEAMID=TROLLTROLL
          mkdir -p sigents-tmp
          make_ents() { # make_ents <repo-entitlements> <bundle-id> <out-plist>
            cp "$1" "$3" || return 1
            # PlistBuddy 的键名分隔符是 /，带点的键是一个整体，不用转义。
            /usr/libexec/PlistBuddy \
              -c "Add :application-identifier string $TEAMID.$2" \
              -c "Add :com.apple.developer.team-identifier string $TEAMID" "$3"
          }

          # 三个 extension 必须在 App 的 PlugIns 里，缺任何一个装上去都是个哑闸门：
          # 没有 monitor extension 就没有计时，没有 shield 就没有拦截。
          # 而 project.yml 里三个 extension 目标是 SKIP_INSTALL: YES，
          # 「依赖列了就会被嵌进去」我只是推测，没有实测过，所以这里自己搬并当场点验。
          mkdir -p "$APP/PlugIns"
          for spec in "QuizGateMonitor:com.quizgate.ios.monitor:Extensions/Monitor/Monitor.entitlements" \
                      "QuizGateShieldConfig:com.quizgate.ios.shieldconfig:Extensions/ShieldConfig/ShieldConfig.entitlements" \
                      "QuizGateShieldAction:com.quizgate.ios.shieldaction:Extensions/ShieldAction/ShieldAction.entitlements"; do
            name=${spec%%:*}; rest=${spec#*:}; bid=${rest%%:*}; ents=${rest#*:}
            dest="$APP/PlugIns/$name.appex"
            if [ ! -d "$dest" ]; then
              src=$(find "$PROD" -maxdepth 1 -name "$name.appex" -type d | head -1)
              [ -n "$src" ] || { echo "$name.appex 根本没被产出：链接过了但没嵌，也没散件" >&2; exit 1; }
              cp -R "$src" "$APP/PlugIns/"
            fi
            # extension 必须先于宿主签：签 App 时会给 PlugIns 里的内容算资源封条，
            # 顺序反了封条就对不上，装上去就是 misconfigured bundle。
            make_ents "$ents" "$bid" "sigents-tmp/$name.plist"
            codesign --force --sign - --timestamp=none \
              --entitlements "sigents-tmp/$name.plist" --generate-entitlement-der "$dest"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$dest/Info.plist" | grep -qx "$bid" \
              || { echo "$name 的 bundle id 不是 $bid" >&2; exit 1; }
          done

          make_ents App/QuizGate.entitlements com.quizgate.ios sigents-tmp/App.plist
          codesign --force --sign - --timestamp=none \
            --entitlements sigents-tmp/App.plist --generate-entitlement-der "$APP"

          # 这一步才是「巨魔会不会给我们想要的东西」的证据面：签名后 entitlements 里
          # 必须逐条看得见 family-controls、App Group 和 application-identifier。
          # 看不见就别往下打包。
          # （grep 直接扫 codesign 的原样输出：上一轮 CI 里前两条 grep 是真跑绿过的，
          # 说明这个输出是可打印 ASCII，键名与值都能匹配上。）
          for pair in "$APP:com.quizgate.ios:sigents-tmp/App.plist" \
                      "$APP/PlugIns/QuizGateMonitor.appex:com.quizgate.ios.monitor:sigents-tmp/QuizGateMonitor.plist" \
                      "$APP/PlugIns/QuizGateShieldConfig.appex:com.quizgate.ios.shieldconfig:sigents-tmp/QuizGateShieldConfig.plist" \
                      "$APP/PlugIns/QuizGateShieldAction.appex:com.quizgate.ios.shieldaction:sigents-tmp/QuizGateShieldAction.plist"; do
            t=${pair%%:*}; rest2=${pair#*:}; bid=${rest2%%:*}; merged=${rest2#*:}
            echo "--- entitlements: $(basename "$t") ---"
            codesign -d --entitlements :- "$t" 2>&1 | head -60
            ents=$(codesign -d --entitlements :- "$t" 2>&1)
            echo "$ents" | grep -q "com.apple.developer.family-controls" \
              || { echo "$(basename "$t") 的签名里丢了 family-controls，装了也不会有权限" >&2; exit 1; }
            echo "$ents" | grep -q "group.com.quizgate.ios" \
              || { echo "$(basename "$t") 的签名里丢了 App Group，主 App 与 extension 读不到同一份状态" >&2; exit 1; }
            # 值本身也要对上：宿主和 extension 各自一个串，服务端按串认人。
            # plutil 读的是我们喂给 codesign 的那份合并 plist（精确值）；
            # grep -a 读的是二进制里的签名封条（证明这条真被签进去了，不是只写在参数里）。
            got=$(plutil -extract application-identifier raw -o - "$merged") \
              || { echo "$(basename "$t") 的合并 plist 里根本没有 application-identifier" >&2; exit 1; }
            [ "$got" = "$TEAMID.$bid" ] \
              || { echo "$(basename "$t") 的 application-identifier 是 $got，不是 $TEAMID.$bid" >&2; exit 1; }
            exe=$(plutil -extract CFBundleExecutable raw -o - "$t/Info.plist")
            grep -qa "$TEAMID.$bid" "$t/$exe" \
              || { echo "$(basename "$t") 的二进制里没有 $TEAMID.$bid 这个串：entitlements 没进签名封条" >&2; exit 1; }
          done

          # 架构也得当场点验：巨魔装一个只有 x86_64 切片的包，报错会写成让人误以为是签名问题的样子。
          echo "--- 宿主可执行文件架构 ---"
          lipo -archs "$APP/QuizGate"
          lipo -archs "$APP/QuizGate" | grep -q arm64 \
            || { echo "产物里没有 arm64，说明这根本不是 device 包" >&2; exit 1; }

      - name: Package ipa
        run: |
          set -e
          rm -rf staging && mkdir -p staging/Payload
          cp -R dd/Build/Products/Release-iphoneos/QuizGate.app staging/Payload/
          # 只从 staging 里打包，避免把 dd 的 DerivedData 杂项和 __MACOSX 带进去。
          ( cd staging && zip -qry ../QuizGate.ipa Payload )
          echo "===== ipa 内容（顶层） ====="
          unzip -l QuizGate.ipa | grep -E "Payload/QuizGate.app/$|PlugIns/.*appex/$|QuizGate.app/QuizGate$"
          echo "===== 三个 extension 齐不齐 ====="
          # 按 .appex 目录名去重计数：条目行里嵌套文件也带 ".appex/"，直接 grep -c 会数出几十行，
          # 那样的「>= 3」是假的 —— 少一个 extension 也照样过。
          names=$(unzip -l QuizGate.ipa | grep -oE 'PlugIns/[^/]+\.appex/' | sort -u)
          echo "$names"
          n=$(printf '%s\n' "$names" | grep -c .)
          echo "appex 去重后：$n 个"
          [ "$n" -eq 3 ] || { echo "ipa 里不是恰好 3 个 appex" >&2; exit 1; }
          ls -l QuizGate.ipa
          shasum -a 256 QuizGate.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizGate-trollstore-ios
          path: QuizGate.ipa
          retention-days: 30
          if-no-files-found: error