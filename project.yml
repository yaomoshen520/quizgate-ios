name: QuizGate

options:
  bundleIdPrefix: com.quizgate
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # App Group 与后端地址只在这里定义一次，由各 target 的 Info.plist 用 $(…) 取。
    # 换环境改这两行即可，不要去改 plist。
    QUIZGATE_APP_GROUP: group.com.quizgate.ios
    QUIZGATE_API_BASE: "http://101.35.194.117:53600"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.28.0"

targets:

  # 主 App、三个 extension 共用的业务层。做成静态库而不是 framework：
  # extension 嵌 framework 要额外处理 embed/runpath，静态库直接链进去省事。
  # APPLICATION_EXTENSION_API_ONLY 强制它不许碰 extension 里用不了的 API（例如 UIApplication.shared）。
  QuizGateKit:
    type: library.static
    platform: iOS
    sources:
      - path: Kit/Sources
    dependencies:
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_NAME: QuizGateKit
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  QuizGateKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Kit/Tests
    dependencies:
      - target: QuizGateKit
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quizgate.ios.kittests
        GENERATE_INFOPLIST_FILE: YES

  QuizGate:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QuizGate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 本轮区间最长寿到当天 23:59，而重配只在前台跑过 —— 这一串就是「孩子一整天
        # 不打开 App」那条路径上的补救。标识符必须与 BackgroundRefresh.identifier 逐字相同，
        # 不一致时 submit 只在真机后台抛错，本机和模拟器上都看不出问题。
        # 刻意没加 UIBackgroundModes：那是 legacy background fetch 的口子，
        # BGAppRefreshTask 只需要这一串，多声明一项等于多要一份没人用的后台时间。
        BGTaskSchedulerPermittedIdentifiers:
          - com.quizgate.ios.rearm
        QUIZGATE_APP_GROUP: $(QUIZGATE_APP_GROUP)
        QUIZGATE_API_BASE: $(QUIZGATE_API_BASE)
        CFBundleURLTypes:
          - CFBundleURLName: com.quizgate.ios
            CFBundleURLSchemes:
              - quizgate
        # 开发期指向局域网明文 HTTP。上线前必须换成 HTTPS 并删掉这一项，
        # 否则等于把孩子的答题流量明文送出去。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quizgate.ios
        CODE_SIGN_ENTITLEMENTS: App/QuizGate.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        # 图标名写死在这里，不靠工具默认值：actool 找不到叫这个名字的图标集是硬失败，
        # 而「xcodegen 会不会替我注入 ASSETCATALOG_COMPILER_APPICON_NAME」属于工具行为，
        # 会随版本变。名字由我们说了算，Assets 里就得有对应那套。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: QuizGateKit
      - target: QuizGateMonitor
      - target: QuizGateShieldConfig
      - target: QuizGateShieldAction
      # 静态库不会把自己的依赖带给链接它的 bundle：QuizGateKit 里那些 import SwiftProtobuf
      # 的代码编得过（.a 不解析外部符号），一旦链进 bundle 就在 ld 阶段炸。
      # 所以每个真正产出 bundle 的目标都得自己声明这枚包 —— 三个 extension 同理。
      - package: SwiftProtobuf

  QuizGateMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Monitor
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: QuizGate Monitor
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        QUIZGATE_APP_GROUP: $(QUIZGATE_APP_GROUP)
        # 每个 extension 是一份独立的 Info.plist，不会继承 App target 里那一项；少了这行
        # AppGroup.apiBase 在扩展进程里就是 nil，而 nil 的下游是静默 return ——
        # 「回调了但上报发不出去」和「根本没回调」在服务端长得一模一样。
        # 只有 Monitor 需要它：另外两个 extension 只往 Outbox 落盘，由主 App 带着地址补发。
        QUIZGATE_API_BASE: $(QUIZGATE_API_BASE)
        # 主 App 那一项不会传给扩展：每份 Info.plist 各管各的 bundle。
        # 后端地址现在是公网明文 HTTP，这里缺一次例外，Monitor 的上报就可能整个被 ATS 拦掉，
        # 而拦掉的样子和「根本没回调」在服务端一模一样。
        # （ATS 到底按 App 还是按扩展生效我没拿到官方原文，属推断；补上这一项两种情况都安全。）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quizgate.ios.monitor
        PRODUCT_NAME: QuizGateMonitor
        CODE_SIGN_ENTITLEMENTS: Extensions/Monitor/Monitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: QuizGateKit
      - package: SwiftProtobuf

  QuizGateShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfig
    info:
      path: Extensions/ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: QuizGate Shield
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        QUIZGATE_APP_GROUP: $(QUIZGATE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quizgate.ios.shieldconfig
        PRODUCT_NAME: QuizGateShieldConfig
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldConfig/ShieldConfig.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: QuizGateKit
      - package: SwiftProtobuf

  QuizGateShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: QuizGate Shield Action
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        QUIZGATE_APP_GROUP: $(QUIZGATE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quizgate.ios.shieldaction
        PRODUCT_NAME: QuizGateShieldAction
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldAction/ShieldAction.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: QuizGateKit
      - package: SwiftProtobuf

schemes:
  # 每个 target 单独一枚 scheme，CI 就能逐 target 编一遍：
  # xcodebuild -target 不会替我们把 SPM 依赖接进 header/search path（SwiftProtobuf 会满屏找不到），
  # 只有走 scheme 才解析；而整包一次 -scheme QuizGate 又是「第一个 target 失败就拆台」，
  # 后面 target 的错根本来不及印出来。所以按 target 拆 scheme，一轮 CI 拿到全部错误。
  QuizGateKit:
    build:
      targets:
        QuizGateKit: all
  QuizGateKitTests:
    build:
      targets:
        QuizGateKitTests: all
  QuizGateMonitor:
    build:
      targets:
        QuizGateMonitor: all
  QuizGateShieldConfig:
    build:
      targets:
        QuizGateShieldConfig: all
  QuizGateShieldAction:
    build:
      targets:
        QuizGateShieldAction: all
  QuizGate:
    build:
      targets:
        QuizGate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuizGateKitTests
    archive:
      config: Release